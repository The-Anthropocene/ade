[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ade"
version = "0.8.0"
description = "A small agentic development environment: one loop, a generated graph; works with Claude Code, Codex, OpenCode or Pi, alone or side by side."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ade = "ade.cli:main"

[tool.setuptools.packages.find]
include = ["ade*"]

[tool.setuptools.package-data]
ade = ["template.toml", "route.toml", "parts.toml", "meter.json",
       "mods/flight-band/.claude-plugin/*", "mods/flight-band/hooks/*", "starters/harness/*.ts"]
