[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ade"
version = "1.0.0"
description = "Atlas ADE, the meta-harness for your agentic workflows: one loop, a generated graph; works with Claude Code, Codex, OpenCode or Pi, alone or side by side."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Practice Atlas Ltd" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://atlas-ade.dev/"
Repository = "https://github.com/The-Anthropocene/ade"
Documentation = "https://atlas-ade.dev/docs/"

[project.scripts]
ade = "ade.cli:main"

[tool.setuptools.packages.find]
include = ["ade*"]

[tool.setuptools.package-data]
ade = ["template.toml", "route.toml", "parts.toml", "meter.json",
       "mods/flight-band/.claude-plugin/*", "mods/flight-band/hooks/*", "starters/harness/*.ts"]
